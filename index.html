<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Official Website Launching Soon — HSS Mundur</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }
    
    body {
      font-family: 'DM Sans', sans-serif;
      background-color: #0f172a; /* Deep elegant dark slate */
      color: #f8fafc;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* Subtle elegant background pattern */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(212, 175, 55, 0.15) 1px, transparent 1px);
      background-size: 24px 24px;
      opacity: 0.7;
      z-index: 1;
    }
    
    .container {
      padding: 2rem;
      max-width: 800px;
      position: relative;
      z-index: 2;
      animation: fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    .school-crest {
      font-size: 3.5rem;
      color: #d4af37; /* Premium Gold */
      margin-bottom: 1.5rem;
      text-shadow: 0 4px 12px rgba(212, 175, 55, 0.2);
    }
    
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 600;
      letter-spacing: 0.02em;
      line-height: 1.1;
      margin-bottom: 0.5rem;
    }

    h2 {
      font-family: 'DM Sans', sans-serif;
      font-size: clamp(1rem, 2.5vw, 1.4rem);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: #94a3b8;
      margin-bottom: 2.5rem;
    }
    
    .status-box {
      display: inline-block;
      background: rgba(212, 175, 55, 0.06);
      border: 1px solid rgba(212, 175, 55, 0.3);
      padding: 1rem 2rem;
      border-radius: 4px;
      margin-bottom: 3rem;
    }

    .status-box p {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.35rem;
      color: #f5f5f7;
    }
    
    .footer-brand {
      position: absolute;
      bottom: 2.5rem;
      font-size: 0.85rem;
      color: rgba(148, 163, 184, 0.7);
      letter-spacing: 0.05em;
      z-index: 2;
    }
    
    .footer-brand strong {
      color: #f8fafc;
    }
    
    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="school-crest">
      <i class="fas fa-graduation-cap"></i>
    </div>
    <h1>HIGHER SECONDARY SCHOOL MUNDUR</h1>
    <h2>Palakkad, Kerala</h2>
    
    <div class="status-box">
      <p>The official digital portal is undergoing preparations for its grand inauguration. Launching soon.</p>
    </div>
  </div>

  <div class="footer-brand">
    MADE WITH <i class="fas fa-heart" style="color: #ff2a2a;"></i> BY <strong>RAS DEVS</strong>
  </div>

</body>
</html>
