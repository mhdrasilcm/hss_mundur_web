<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — HSS Mundur</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">  
  <link rel="stylesheet" href="main.css">
  <style>
    .error-page { min-height: 100vh; display: flex; flex-direction: column; background: var(--cream); }
    .error-content { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 20px; }
    .error-content h1 { font-size: clamp(6rem, 15vw, 10rem); color: var(--gold); line-height: 1; margin-bottom: 20px; }
    .error-content h2 { font-size: clamp(1.8rem, 4vw, 2.5rem); margin-bottom: 16px; color: var(--navy); }
    .error-content p { max-width: 500px; margin: 0 auto 40px; color: var(--text-mid); font-size: 1.1rem; }
  </style>
</head>
<body class="error-page">

  <header style="position: relative; background: var(--navy); height: 80px; display: flex; align-items: center;">
    <div class="container" style="display: flex; justify-content: center;">
      <a href="/" class="logo">
        <div class="logo-icon"><i class="fas fa-graduation-cap"></i></div>
        <div class="logo-text">
          <h1>HSS MUNDUR</h1>
          <p>Higher Secondary School, Palakkad</p>
        </div>
      </a>
    </div>
  </header>

  <main class="error-content fade-in">
    <h1>404</h1>
    <h2>Class Dismissed!</h2>
    <p>The page you are looking for has been moved, removed, or doesn't exist. Let's get you back to the main campus.</p>
    <a href="/" class="btn btn-primary"><i class="fas fa-home"></i> Return to Homepage</a>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelector('.fade-in').style.opacity = '1';
      document.querySelector('.fade-in').style.transform = 'translateY(0)';
    });
  </script>
</body>
</html>
