<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Official Launch — HSS Mundur</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #080c14;
      color: white;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Grid overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(99,102,241,0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99,102,241,0.07) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* Ambient glow */
    body::after {
      content: '';
      position: fixed;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(99,102,241,0.1) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }

    /* Screen flash animation */
    .flash-active {
      animation: flashScreen 0.8s ease-out forwards;
    }
    @keyframes flashScreen {
      0%   { background-color: #064e3b; }
      100% { background-color: #080c14; }
    }

    /* ── MAIN STATE ── */
    #main-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 0;
      z-index: 1;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(99,102,241,0.12);
      border: 1px solid rgba(99,102,241,0.3);
      border-radius: 100px;
      padding: 6px 18px;
      margin-bottom: 28px;
    }
    .badge-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #818cf8;
      animation: dot-pulse 2s infinite;
    }
    .badge-text {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #818cf8;
      font-weight: 500;
    }
    @keyframes dot-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.75); }
    }

    .school-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #475569;
      margin-bottom: 8px;
    }

    .portal-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 30px;
      font-weight: 700;
      color: #f1f5f9;
      letter-spacing: 0.05em;
      margin-bottom: 48px;
    }

    /* ── BUTTON ── */
    .btn-wrap {
      position: relative;
      margin-bottom: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-ring {
      position: absolute;
      inset: -18px;
      border-radius: 50%;
      border: 1px solid rgba(239,68,68,0.2);
      animation: ring-anim 2s linear infinite;
      pointer-events: none;
    }
    .btn-ring2 {
      position: absolute;
      inset: -36px;
      border-radius: 50%;
      border: 1px solid rgba(239,68,68,0.08);
      animation: ring-anim 2s linear infinite 0.7s;
      pointer-events: none;
    }
    @keyframes ring-anim {
      0%   { transform: scale(0.85); opacity: 0.8; }
      100% { transform: scale(1.12); opacity: 0; }
    }

    .launch-btn {
      width: 210px; height: 210px;
      border-radius: 50%;
      background: linear-gradient(155deg, #ef4444 0%, #b91c1c 100%);
      border: none;
      outline: none;
      cursor: pointer;
      position: relative;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow:
        0 0 50px rgba(239,68,68,0.28),
        0 24px 60px rgba(0,0,0,0.55);
    }
    /* Inner shine */
    .launch-btn::before {
      content: '';
      position: absolute;
      inset: 3px;
      border-radius: 50%;
      background: linear-gradient(155deg, rgba(255,255,255,0.2) 0%, transparent 55%);
      pointer-events: none;
    }
    .launch-btn:hover {
      transform: scale(1.06);
      box-shadow:
        0 0 80px rgba(239,68,68,0.5),
        0 28px 70px rgba(0,0,0,0.6);
    }
    .launch-btn:active {
      transform: scale(0.95);
      box-shadow:
        0 0 20px rgba(239,68,68,0.2),
        0 12px 30px rgba(0,0,0,0.4);
    }

    .btn-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .btn-label {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 22px;
      letter-spacing: 0.22em;
      font-weight: 700;
      text-transform: uppercase;
      color: white;
    }
    .btn-sub {
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
    }

    /* ── META STRIP ── */
    .meta-strip {
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .meta-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    .meta-val {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: #e2e8f0;
    }
    .meta-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: #475569;
    }
    .meta-divider {
      width: 1px; height: 32px;
      background: #1e293b;
    }

    /* ── COUNTDOWN STATE ── */
    #countdown-state {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }
    #countdown-num {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 140px;
      font-weight: 700;
      color: #f1f5f9;
      line-height: 1;
      transition: transform 0.15s ease, opacity 0.15s ease, color 0.3s ease;
    }

    /* ── LOADING STATE ── */
    #loading-state {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 1;
    }
    .load-label {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #22d3ee;
      min-height: 20px;
    }
    .progress-track {
      width: 340px;
      height: 3px;
      background: #1e293b;
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #06b6d4, #6366f1);
      border-radius: 2px;
      transition: width 3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .load-sub {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #334155;
      min-height: 16px;
    }

    /* ── SUCCESS STATE ── */
    #success-state {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 1;
      animation: pop-in 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes pop-in {
      0%   { transform: scale(0.65); opacity: 0; }
      100% { transform: scale(1);    opacity: 1; }
    }
    .success-icon {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: rgba(34,197,94,0.12);
      border: 1px solid rgba(34,197,94,0.3);
      display: flex; align-items: center; justify-content: center;
    }
    .success-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 36px;
      font-weight: 700;
      color: #4ade80;
      letter-spacing: 0.1em;
    }
    .success-sub {
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #64748b;
    }
    .redirect-bar {
      width: 200px; height: 2px;
      background: #1e293b;
      border-radius: 2px;
      overflow: hidden;
      margin-top: 4px;
    }
    .redirect-fill {
      width: 0%;
      height: 100%;
      background: #4ade80;
      transition: width 1.4s linear;
    }

    /* ── FOOTER ── */
    .footer {
      position: fixed;
      bottom: 22px;
      left: 0; right: 0;
      text-align: center;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #1e293b;
      z-index: 1;
    }
    .footer strong { color: #334155; }
  </style>
</head>
<body>

  <!-- MAIN STATE -->
  <div id="main-state">
    <div class="badge">
      <div class="badge-dot"></div>
      <span class="badge-text">Official Launch</span>
    </div>
    <div class="school-name">HSS Mundur &middot; Palakkad, Kerala</div>
    <div class="portal-title">Digital Portal</div>

    <div class="btn-wrap">
      <div class="btn-ring"></div>
      <div class="btn-ring2"></div>
      <button class="launch-btn" id="launchBtn">
        <div class="btn-inner">
          <div class="btn-label">Launch</div>
          <div class="btn-sub">Click to begin</div>
        </div>
      </button>
    </div>

    <div class="meta-strip">
      <div class="meta-item">
        <span class="meta-val">2025</span>
        <span class="meta-label">Year</span>
      </div>
      <div class="meta-divider"></div>
      <div class="meta-item">
        <span class="meta-val">v2.0</span>
        <span class="meta-label">Release</span>
      </div>
      <div class="meta-divider"></div>
      <div class="meta-item">
        <span class="meta-val">LIVE</span>
        <span class="meta-label">Status</span>
      </div>
    </div>
  </div>

  <!-- COUNTDOWN STATE -->
  <div id="countdown-state">
    <div id="countdown-num">3</div>
  </div>

  <!-- LOADING STATE -->
  <div id="loading-state">
    <div class="load-label" id="loadLabel">Initializing portal</div>
    <div class="progress-track">
      <div class="progress-fill" id="progressBar"></div>
    </div>
    <div class="load-sub" id="loadSub">Establishing secure connection</div>
  </div>

  <!-- SUCCESS STATE -->
  <div id="success-state">
    <div class="success-icon">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none"
        stroke="#4ade80" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
    <div class="success-title">System Online</div>
    <div class="success-sub">Redirecting to portal…</div>
    <div class="redirect-bar">
      <div class="redirect-fill" id="redirectFill"></div>
    </div>
  </div>

  <div class="footer">System engineered by <strong>Ras Devs</strong></div>

  <script>
    const mainState      = document.getElementById('main-state');
    const countdownState = document.getElementById('countdown-state');
    const countdownNum   = document.getElementById('countdown-num');
    const loadingState   = document.getElementById('loading-state');
    const progressBar    = document.getElementById('progressBar');
    const loadLabel      = document.getElementById('loadLabel');
    const loadSub        = document.getElementById('loadSub');
    const successState   = document.getElementById('success-state');
    const redirectFill   = document.getElementById('redirectFill');

    document.getElementById('launchBtn').addEventListener('click', () => {
      // Fade out main
      mainState.style.transition = 'opacity 0.4s ease';
      mainState.style.opacity = '0';
      setTimeout(() => {
        mainState.style.display = 'none';
        countdownState.style.display = 'flex';
      }, 400);

      let count = 3;
      countdownNum.textContent = count;

      const timer = setInterval(() => {
        count--;
        if (count > 0) {
          animateCountdown(count, '#f1f5f9');
        } else if (count === 0) {
          clearInterval(timer);
          animateCountdown('GO', '#4ade80');
          fireConfetti();

          setTimeout(() => {
            countdownState.style.transition = 'opacity 0.4s ease';
            countdownState.style.opacity = '0';
            setTimeout(() => {
              countdownState.style.display = 'none';
              loadingState.style.display = 'flex';

              // Kick off the progress bar
              setTimeout(() => { progressBar.style.width = '100%'; }, 50);

              // Cycle loading messages
              setTimeout(() => {
                loadLabel.textContent = 'Decrypting clusters';
                loadSub.textContent   = 'Validating access tokens...';
              }, 800);
              setTimeout(() => {
                loadLabel.textContent = 'Routing to server';
                loadSub.textContent   = 'Bypassing local cache...';
              }, 1700);
              setTimeout(() => {
                loadLabel.textContent = 'Almost ready';
                loadSub.textContent   = 'Finalizing handshake...';
              }, 2500);

              // Done — flash and show success
              setTimeout(() => {
                document.body.classList.add('flash-active');
                loadingState.style.display = 'none';
                successState.style.display = 'flex';
                setTimeout(() => { redirectFill.style.width = '100%'; }, 50);
                setTimeout(() => {
                  window.location.href = 'https://hssmundur.netlify.app';
                }, 1500);
              }, 3100);

            }, 400);
          }, 1800);
        }
      }, 1000);
    });

    function animateCountdown(value, color) {
      countdownNum.style.transition = 'transform 0.15s ease, opacity 0.15s ease';
      countdownNum.style.transform  = 'scale(0.65)';
      countdownNum.style.opacity    = '0';
      setTimeout(() => {
        countdownNum.textContent   = value;
        countdownNum.style.color   = color;
        countdownNum.style.transform = 'scale(1)';
        countdownNum.style.opacity   = '1';
      }, 155);
    }

    function fireConfetti() {
      const end = Date.now() + 2800;
      (function frame() {
        confetti({
          particleCount: 6, angle: 60, spread: 65,
          origin: { x: 0 },
          colors: ['#6366f1', '#ffffff', '#f43f5e', '#22d3ee']
        });
        confetti({
          particleCount: 6, angle: 120, spread: 65,
          origin: { x: 1 },
          colors: ['#6366f1', '#ffffff', '#f43f5e', '#22d3ee']
        });
        if (Date.now() < end) requestAnimationFrame(frame);
      }());
    }
  </script>
</body>
</html>
